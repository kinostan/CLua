# CLion Custom Compiler Configuration
compilers:
  - description: "MinGW-w64 GCC Custom Toolchain for CLua"
    match-compiler-exe: "C:\msys64\mingw64"

    # Core compiler configuration mappings
    language: BOTH
    compiler-family: GCC

    # Default options parsed on project initialization
    mandatory-options:
      - "-m64"
      - "-std=gnu++26"

    # Defines mapped directly from your VS Code profiles
    defines:
      _DEBUG: "1"
      UNICODE: "1"
      _UNICODE: "1"